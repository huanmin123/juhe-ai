# juhe-ai 内网生产演练单机 Compose（仅 gateway/jobs/maintenance）。
#
# 本实例按生产语义运行（NODE_ENV=production、验证码开启、强制改密门禁开启），
# 但不是生产实例；唯一例外是内网 HTTP 使用 COOKIE_SECURE=false。
#
# 与 docker/single-server/compose.yml 的差异：
# - 不启动 PostgreSQL / Redis / Caddy：复用 aiagent dev 服务器的 pg16 容器与共享 Redis；
# - gateway 不直接对外，只发布 127.0.0.1:13000，由宿主 Nginx 8193 内网入口反代；
# - 加入 infra_default（访问 pg16）与 monitoring_default（供后续 Prometheus 抓取）；
# - 数据目录固定在 ./data/app，容器仍以 UID/GID 1000 的 app 用户运行。
#
# 部署根：/opt/juhe-ai-dev；构建产物（build/bin、build/frontend-dist）由本机交叉编译后上传。
name: juhe-ai-dev

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        BASE_IMAGE: docker.m.daocloud.io/library/alpine:3.20
        TARGET_BINARY: juhe-ai-gateway
    image: juhe-ai-dev-gateway:latest
    container_name: juhe-ai-go-gateway
    restart: unless-stopped
    mem_limit: "2g"
    working_dir: /app/backend
    networks:
      - infra_default
      - monitoring_default
    ports:
      # 只给宿主 Nginx 用；不对局域网直接发布。
      - "127.0.0.1:13000:3000"
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      # 与 mem_limit 保持约 75% 比例，避免演练高峰把整机页缓存挤掉。
      GOMEMLIMIT: 1536MiB
    volumes:
      - ./data/app/data:/app/backend/data
      - ./data/app/logs:/app/backend/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3306/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 75s

  jobs:
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        BASE_IMAGE: docker.m.daocloud.io/library/alpine:3.20
        TARGET_BINARY: juhe-ai-jobs
    image: juhe-ai-dev-jobs:latest
    container_name: juhe-ai-go-jobs
    restart: unless-stopped
    mem_limit: "512m"
    working_dir: /app/backend
    networks:
      - infra_default
      - monitoring_default
    # jobs 启动会校验 juhe_dataset.operation_logs（gateway F4 启动时创建）；
    # 首次全新库必须等 gateway healthy，避免抢跑后依赖 restart 兜底。
    depends_on:
      gateway:
        condition: service_healthy
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      JUHE_AI_INSTANCE_ID: juhe-ai-dev-jobs
    volumes:
      - ./data/app/data:/app/backend/data
      - ./data/app/logs:/app/backend/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3305/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # 一次性工具：docker compose --profile tool run --rm maintenance upgrade ...
  maintenance:
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        BASE_IMAGE: docker.m.daocloud.io/library/alpine:3.20
        TARGET_BINARY: juhe-ai-maintenance
    image: juhe-ai-dev-maintenance:latest
    container_name: juhe-ai-maintenance
    profiles: ["tool"]
    working_dir: /app/backend
    networks:
      - infra_default
    env_file: .env
    volumes:
      - ./data/app/data:/app/backend/data
      - ./data/app/logs:/app/backend/logs
    environment:
      TZ: Asia/Shanghai

networks:
  infra_default:
    external: true
    name: infra_default
  # 核心应用指标已接入现有 Prometheus；保留网络挂载，可选 exporter 可直接抓取容器名。
  monitoring_default:
    external: true
    name: monitoring_default
