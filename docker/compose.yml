services:
  juhe-ai:
    image: ${JUHE_AI_IMAGE:-juhe-ai:local}
    container_name: ${JUHE_AI_CONTAINER_NAME:-juhe-ai}
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NODE_IMAGE: ${JUHE_AI_NODE_IMAGE:-node:22-bookworm-slim}
        PNPM_VERSION: ${JUHE_AI_PNPM_VERSION:-10.32.1}
    ports:
      - "${JUHE_AI_PUBLIC_BIND:-127.0.0.1}:${JUHE_AI_PUBLIC_PORT:-3000}:${JUHE_AI_PORT:-3000}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      JUHE_AI_HOST: ${JUHE_AI_HOST:-0.0.0.0}
      JUHE_AI_PORT: ${JUHE_AI_PORT:-3000}
      JUHE_AI_PUBLIC_PORT: ${JUHE_AI_PUBLIC_PORT:-3000}
      JUHE_AI_PUBLIC_ORIGIN: ${JUHE_AI_PUBLIC_ORIGIN:-}
      JUHE_AI_ALLOWED_ORIGINS: ${JUHE_AI_ALLOWED_ORIGINS:-}
      JUHE_AI_SECRET: ${JUHE_AI_SECRET:-}
      JUHE_AI_COOKIE_SECURE: ${JUHE_AI_COOKIE_SECURE:-false}
      JUHE_AI_COOKIE_SAME_SITE: ${JUHE_AI_COOKIE_SAME_SITE:-lax}
      JUHE_AI_TRUST_PROXY: ${JUHE_AI_TRUST_PROXY:-false}
      JUHE_AI_DB_SERVICE_HTTP_HOST: ${JUHE_AI_DB_SERVICE_HTTP_HOST:-127.0.0.1}
      JUHE_AI_DB_SERVICE_HTTP_PORT: ${JUHE_AI_DB_SERVICE_HTTP_PORT:-0}
      JUHE_AI_RUNTIME_MODE: ${JUHE_AI_RUNTIME_MODE:-standalone}
      JUHE_AI_DATABASE_DRIVER: ${JUHE_AI_DATABASE_DRIVER:-sqlite}
      JUHE_AI_CACHE_DRIVER: ${JUHE_AI_CACHE_DRIVER:-memory}
      JUHE_AI_RUNTIME_STATE_DRIVER: ${JUHE_AI_RUNTIME_STATE_DRIVER:-memory}
      JUHE_AI_QUEUE_DRIVER: ${JUHE_AI_QUEUE_DRIVER:-memory}
      JUHE_AI_AUDIT_LOG_ENABLED: ${JUHE_AI_AUDIT_LOG_ENABLED:-true}
      JUHE_AI_AUDIT_LOG_SUCCESS_HOT_RETENTION_HOURS: ${JUHE_AI_AUDIT_LOG_SUCCESS_HOT_RETENTION_HOURS:-1}
      JUHE_AI_AUDIT_LOG_SUCCESS_SAMPLE_RATE: ${JUHE_AI_AUDIT_LOG_SUCCESS_SAMPLE_RATE:-0.1}
      JUHE_AI_AUDIT_LOG_SUCCESS_RETENTION_DAYS: ${JUHE_AI_AUDIT_LOG_SUCCESS_RETENTION_DAYS:-3}
      JUHE_AI_AUDIT_LOG_PROBLEM_RETENTION_DAYS: ${JUHE_AI_AUDIT_LOG_PROBLEM_RETENTION_DAYS:-7}
      JUHE_AI_AUDIT_LOG_SUCCESS_FULL_BODY_LIMIT_KB: ${JUHE_AI_AUDIT_LOG_SUCCESS_FULL_BODY_LIMIT_KB:-512}
      JUHE_AI_AUDIT_LOG_PROBLEM_FULL_BODY_LIMIT_KB: ${JUHE_AI_AUDIT_LOG_PROBLEM_FULL_BODY_LIMIT_KB:-2048}
      JUHE_AI_AUDIT_LOG_INPUT_URL: ${JUHE_AI_AUDIT_LOG_INPUT_URL:-http://127.0.0.1:3303}
      JUHE_AI_AUDIT_LOG_INPUT_SECRET: ${JUHE_AI_AUDIT_LOG_INPUT_SECRET:?JUHE_AI_AUDIT_LOG_INPUT_SECRET is required}
      JUHE_AI_AUDIT_LOG_DATABASE_PATH: ${JUHE_AI_AUDIT_LOG_DATABASE_PATH:-/app/backend/audit-log-data/juhe-ai-audit-log.sqlite3}
      JUHE_AI_AUDIT_LOG_BLOB_DIRECTORY: ${JUHE_AI_AUDIT_LOG_BLOB_DIRECTORY:-/app/backend/audit-log-data/audit-payload-blobs}
      JUHE_AI_AUDIT_LOG_HOT_SEARCH_DIRECTORY: ${JUHE_AI_AUDIT_LOG_HOT_SEARCH_DIRECTORY:-/app/backend/audit-log-data/audit-hot-search}
      JUHE_AI_POSTGRES_URL: ${JUHE_AI_POSTGRES_URL:-}
      JUHE_AI_REDIS_CACHE_URL: ${JUHE_AI_REDIS_CACHE_URL:-}
      JUHE_AI_REDIS_STATE_URL: ${JUHE_AI_REDIS_STATE_URL:-}
      JUHE_AI_REDIS_QUEUE_URL: ${JUHE_AI_REDIS_QUEUE_URL:-}
      JUHE_AI_DB_POOL_MAX: ${JUHE_AI_DB_POOL_MAX:-50}
      JUHE_AI_DB_WRITE_MAX_CONCURRENCY: ${JUHE_AI_DB_WRITE_MAX_CONCURRENCY:-100}
      JUHE_AI_DB_WRITE_QUEUE_MAX_ITEMS: ${JUHE_AI_DB_WRITE_QUEUE_MAX_ITEMS:-50000}
      JUHE_AI_DATABASE_PATH: ${JUHE_AI_DATABASE_PATH:-/app/backend/data/juhe-ai.sqlite3}
      JUHE_AI_DATASET_DATABASE_PATH: ${JUHE_AI_DATASET_DATABASE_PATH:-/app/backend/data/juhe-ai-dataset.sqlite3}
      JUHE_AI_RUNTIME_LOG_DATABASE_PATH: ${JUHE_AI_RUNTIME_LOG_DATABASE_PATH:-/app/backend/runtime-log-data/juhe-ai-runtime-log.sqlite3}
      JUHE_AI_TABLE_MONITOR_DATABASE_PATH: ${JUHE_AI_TABLE_MONITOR_DATABASE_PATH:-/app/backend/table-monitor-data/juhe-ai-table-monitor.sqlite3}
      JUHE_AI_USAGE_CATALOG_DATABASE_PATH: ${JUHE_AI_USAGE_CATALOG_DATABASE_PATH:-/app/backend/data/juhe-ai-usage-catalog.sqlite3}
      JUHE_AI_STATS_DATABASE_PATH: ${JUHE_AI_STATS_DATABASE_PATH:-/app/backend/data/juhe-ai-stats.sqlite3}
      JUHE_AI_CODEX_CONTEXT_STATE_SHARD_ROOT: ${JUHE_AI_CODEX_CONTEXT_STATE_SHARD_ROOT:-/app/backend/data/codex-context/state-shards}
      JUHE_AI_USAGE_SHARD_ROOT: ${JUHE_AI_USAGE_SHARD_ROOT:-/app/backend/data/usage-shards}
      JUHE_AI_USAGE_SHARD_COUNT: ${JUHE_AI_USAGE_SHARD_COUNT:-16}
      JUHE_AI_LOG_DIR: ${JUHE_AI_LOG_DIR:-/app/backend/logs}
      JUHE_AI_LOG_FILE_ENABLED: ${JUHE_AI_LOG_FILE_ENABLED:-true}
      JUHE_AI_LOG_CONSOLE_ENABLED: ${JUHE_AI_LOG_CONSOLE_ENABLED:-true}
      JUHE_AI_ALLOW_PRIVATE_UPSTREAM_BASE_URLS: ${JUHE_AI_ALLOW_PRIVATE_UPSTREAM_BASE_URLS:-false}
      JUHE_AI_UPSTREAM_BASE_URL_PRIVATE_ALLOWLIST: ${JUHE_AI_UPSTREAM_BASE_URL_PRIVATE_ALLOWLIST:-}
      JUHE_AI_OAUTH_PROXY_URL: ${JUHE_AI_OAUTH_PROXY_URL:-}
    volumes:
      - juhe-ai-data:/app/backend/data
      - juhe-ai-runtime-log-data:/app/backend/runtime-log-data:ro
      - juhe-ai-table-monitor-data:/app/backend/table-monitor-data:ro
      - juhe-ai-audit-log-data:/app/backend/audit-log-data:ro
      - juhe-ai-logs:/app/backend/logs
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.JUHE_AI_PORT || '3000') + '/__aisys__/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  runtime-log-indexer:
    image: ${JUHE_AI_RUNTIME_LOG_INDEXER_IMAGE:-juhe-ai-runtime-log-indexer:local}
    container_name: ${JUHE_AI_RUNTIME_LOG_INDEXER_CONTAINER_NAME:-juhe-ai-runtime-log-indexer}
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime-log-indexer
      args:
        GO_IMAGE: ${JUHE_AI_GO_IMAGE:-golang:1.26-bookworm}
        RUNTIME_IMAGE: ${JUHE_AI_RUNTIME_LOG_INDEXER_RUNTIME_IMAGE:-debian:bookworm-slim}
        GO_PROXY: ${JUHE_AI_GO_PROXY:-https://proxy.golang.org,direct}
    depends_on:
      juhe-ai:
        condition: service_healthy
    environment:
      JUHE_AI_RUNTIME_LOG_INSTANCE_ID: ${JUHE_AI_RUNTIME_LOG_INSTANCE_ID:-juhe-ai-runtime-log-indexer}
      JUHE_AI_RUNTIME_LOG_STORE: ${JUHE_AI_RUNTIME_LOG_STORE:-sqlite}
      JUHE_AI_RUNTIME_LOG_ONCE: ${JUHE_AI_RUNTIME_LOG_ONCE:-false}
      JUHE_AI_RUNTIME_LOG_DATABASE_PATH: ${JUHE_AI_RUNTIME_LOG_DATABASE_PATH:-/app/backend/runtime-log-data/juhe-ai-runtime-log.sqlite3}
      JUHE_AI_TABLE_MONITOR_DATABASE_PATH: ${JUHE_AI_TABLE_MONITOR_DATABASE_PATH:-/app/backend/table-monitor-data/juhe-ai-table-monitor.sqlite3}
      JUHE_AI_DATASET_DATABASE_PATH: ${JUHE_AI_DATASET_DATABASE_PATH:-/app/backend/data/juhe-ai-dataset.sqlite3}
      JUHE_AI_DATABASE_PATH: ${JUHE_AI_DATABASE_PATH:-/app/backend/data/juhe-ai.sqlite3}
      JUHE_AI_USAGE_CATALOG_DATABASE_PATH: ${JUHE_AI_USAGE_CATALOG_DATABASE_PATH:-/app/backend/data/juhe-ai-usage-catalog.sqlite3}
      JUHE_AI_STATS_DATABASE_PATH: ${JUHE_AI_STATS_DATABASE_PATH:-/app/backend/data/juhe-ai-stats.sqlite3}
      JUHE_AI_CODEX_CONTEXT_STATE_SHARD_ROOT: ${JUHE_AI_CODEX_CONTEXT_STATE_SHARD_ROOT:-/app/backend/data/codex-context/state-shards}
      JUHE_AI_LOG_DIR: ${JUHE_AI_LOG_DIR:-/app/backend/logs}
      JUHE_AI_LOG_FILE_ENABLED: ${JUHE_AI_LOG_FILE_ENABLED:-true}
    volumes:
      - juhe-ai-data:/app/backend/data:ro
      - juhe-ai-runtime-log-data:/app/backend/runtime-log-data
      - juhe-ai-table-monitor-data:/app/backend/table-monitor-data:ro
      - juhe-ai-logs:/app/backend/logs
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && test -d \"$${JUHE_AI_LOG_DIR}\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  table-monitor:
    image: ${JUHE_AI_TABLE_MONITOR_IMAGE:-juhe-ai-table-monitor:local}
    container_name: ${JUHE_AI_TABLE_MONITOR_CONTAINER_NAME:-juhe-ai-table-monitor}
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.table-monitor
      args:
        GO_IMAGE: ${JUHE_AI_GO_IMAGE:-golang:1.26-bookworm}
        RUNTIME_IMAGE: ${JUHE_AI_TABLE_MONITOR_RUNTIME_IMAGE:-debian:bookworm-slim}
        GO_PROXY: ${JUHE_AI_GO_PROXY:-https://proxy.golang.org,direct}
    depends_on:
      juhe-ai:
        condition: service_healthy
    environment:
      JUHE_AI_TABLE_MONITOR_INSTANCE_ID: ${JUHE_AI_TABLE_MONITOR_INSTANCE_ID:?JUHE_AI_TABLE_MONITOR_INSTANCE_ID is required}
      JUHE_AI_TABLE_MONITOR_STORE: ${JUHE_AI_TABLE_MONITOR_STORE:-sqlite}
      JUHE_AI_TABLE_MONITOR_DATABASE_PATH: ${JUHE_AI_TABLE_MONITOR_DATABASE_PATH:-/app/backend/table-monitor-data/juhe-ai-table-monitor.sqlite3}
      JUHE_AI_TABLE_MONITOR_INTERVAL: ${JUHE_AI_TABLE_MONITOR_INTERVAL:-1m}
      JUHE_AI_TABLE_MONITOR_RUN_TIMEOUT: ${JUHE_AI_TABLE_MONITOR_RUN_TIMEOUT:-45s}
      JUHE_AI_TABLE_MONITOR_OWNER_LEASE: ${JUHE_AI_TABLE_MONITOR_OWNER_LEASE:-5m}
      JUHE_AI_TABLE_MONITOR_RETENTION_DAYS: ${JUHE_AI_TABLE_MONITOR_RETENTION_DAYS:-30}
      JUHE_AI_TABLE_MONITOR_MAX_TABLES: ${JUHE_AI_TABLE_MONITOR_MAX_TABLES:-256}
      JUHE_AI_TABLE_MONITOR_MAX_CONCURRENT_SOURCES: ${JUHE_AI_TABLE_MONITOR_MAX_CONCURRENT_SOURCES:-8}
      JUHE_AI_TABLE_MONITOR_RETENTION_BATCH_SIZE: ${JUHE_AI_TABLE_MONITOR_RETENTION_BATCH_SIZE:-1000}
      JUHE_AI_TABLE_MONITOR_RETENTION_MAX_BATCHES: ${JUHE_AI_TABLE_MONITOR_RETENTION_MAX_BATCHES:-1000}
      JUHE_AI_RUNTIME_LOG_DATABASE_PATH: ${JUHE_AI_RUNTIME_LOG_DATABASE_PATH:-/app/backend/runtime-log-data/juhe-ai-runtime-log.sqlite3}
      JUHE_AI_DATABASE_PATH: ${JUHE_AI_DATABASE_PATH:-/app/backend/data/juhe-ai.sqlite3}
      JUHE_AI_DATASET_DATABASE_PATH: ${JUHE_AI_DATASET_DATABASE_PATH:-/app/backend/data/juhe-ai-dataset.sqlite3}
      JUHE_AI_USAGE_CATALOG_DATABASE_PATH: ${JUHE_AI_USAGE_CATALOG_DATABASE_PATH:-/app/backend/data/juhe-ai-usage-catalog.sqlite3}
      JUHE_AI_STATS_DATABASE_PATH: ${JUHE_AI_STATS_DATABASE_PATH:-/app/backend/data/juhe-ai-stats.sqlite3}
      JUHE_AI_CODEX_CONTEXT_STATE_SHARD_ROOT: ${JUHE_AI_CODEX_CONTEXT_STATE_SHARD_ROOT:-/app/backend/data/codex-context/state-shards}
    volumes:
      - juhe-ai-data:/app/backend/data:ro
      - juhe-ai-runtime-log-data:/app/backend/runtime-log-data:ro
      - juhe-ai-table-monitor-data:/app/backend/table-monitor-data
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  audit-log-writer:
    image: ${JUHE_AI_AUDIT_LOG_WRITER_IMAGE:-juhe-ai-audit-log-writer:local}
    container_name: ${JUHE_AI_AUDIT_LOG_WRITER_CONTAINER_NAME:-juhe-ai-audit-log-writer}
    restart: unless-stopped
    network_mode: service:juhe-ai
    build:
      context: ..
      dockerfile: docker/Dockerfile.audit-log-writer
      args:
        GO_IMAGE: ${JUHE_AI_GO_IMAGE:-golang:1.26-bookworm}
        RUNTIME_IMAGE: ${JUHE_AI_AUDIT_LOG_WRITER_RUNTIME_IMAGE:-debian:bookworm-slim}
        GO_PROXY: ${JUHE_AI_GO_PROXY:-https://proxy.golang.org,direct}
    depends_on:
      juhe-ai:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      JUHE_AI_AUDIT_LOG_INSTANCE_ID: ${JUHE_AI_AUDIT_LOG_INSTANCE_ID:?JUHE_AI_AUDIT_LOG_INSTANCE_ID is required}
      JUHE_AI_AUDIT_LOG_STORE: ${JUHE_AI_AUDIT_LOG_STORE:-sqlite}
      JUHE_AI_AUDIT_LOG_DATABASE_PATH: ${JUHE_AI_AUDIT_LOG_DATABASE_PATH:-/app/backend/audit-log-data/juhe-ai-audit-log.sqlite3}
      JUHE_AI_AUDIT_LOG_BLOB_DIRECTORY: ${JUHE_AI_AUDIT_LOG_BLOB_DIRECTORY:-/app/backend/audit-log-data/audit-payload-blobs}
      JUHE_AI_AUDIT_LOG_HOT_SEARCH_DIRECTORY: ${JUHE_AI_AUDIT_LOG_HOT_SEARCH_DIRECTORY:-/app/backend/audit-log-data/audit-hot-search}
      JUHE_AI_AUDIT_LOG_BUSINESS_SETTINGS_PATH: ${JUHE_AI_AUDIT_LOG_BUSINESS_SETTINGS_PATH:-/app/backend/data/juhe-ai.sqlite3}
      JUHE_AI_AUDIT_LOG_OWNER_LEASE: ${JUHE_AI_AUDIT_LOG_OWNER_LEASE:-30s}
      JUHE_AI_AUDIT_LOG_RETENTION_INTERVAL: ${JUHE_AI_AUDIT_LOG_RETENTION_INTERVAL:-1m}
      JUHE_AI_AUDIT_LOG_RETENTION_BATCH_SIZE: ${JUHE_AI_AUDIT_LOG_RETENTION_BATCH_SIZE:-100}
      JUHE_AI_AUDIT_LOG_SUCCESS_HOT_RETENTION_HOURS: ${JUHE_AI_AUDIT_LOG_SUCCESS_HOT_RETENTION_HOURS:-1}
      JUHE_AI_AUDIT_LOG_SUCCESS_SAMPLE_RATE: ${JUHE_AI_AUDIT_LOG_SUCCESS_SAMPLE_RATE:-0.1}
      JUHE_AI_AUDIT_LOG_SUCCESS_RETENTION_DAYS: ${JUHE_AI_AUDIT_LOG_SUCCESS_RETENTION_DAYS:-3}
      JUHE_AI_AUDIT_LOG_PROBLEM_RETENTION_DAYS: ${JUHE_AI_AUDIT_LOG_PROBLEM_RETENTION_DAYS:-7}
      JUHE_AI_AUDIT_LOG_INPUT_LISTEN_ADDRESS: ${JUHE_AI_AUDIT_LOG_INPUT_LISTEN_ADDRESS:-127.0.0.1:3303}
      JUHE_AI_AUDIT_LOG_INPUT_SECRET: ${JUHE_AI_AUDIT_LOG_INPUT_SECRET:?JUHE_AI_AUDIT_LOG_INPUT_SECRET is required}
      JUHE_AI_DATABASE_PATH: ${JUHE_AI_DATABASE_PATH:-/app/backend/data/juhe-ai.sqlite3}
      JUHE_AI_DATASET_DATABASE_PATH: ${JUHE_AI_DATASET_DATABASE_PATH:-/app/backend/data/juhe-ai-dataset.sqlite3}
      JUHE_AI_USAGE_CATALOG_DATABASE_PATH: ${JUHE_AI_USAGE_CATALOG_DATABASE_PATH:-/app/backend/data/juhe-ai-usage-catalog.sqlite3}
      JUHE_AI_STATS_DATABASE_PATH: ${JUHE_AI_STATS_DATABASE_PATH:-/app/backend/data/juhe-ai-stats.sqlite3}
      JUHE_AI_RUNTIME_LOG_DATABASE_PATH: ${JUHE_AI_RUNTIME_LOG_DATABASE_PATH:-/app/backend/runtime-log-data/juhe-ai-runtime-log.sqlite3}
      JUHE_AI_TABLE_MONITOR_DATABASE_PATH: ${JUHE_AI_TABLE_MONITOR_DATABASE_PATH:-/app/backend/table-monitor-data/juhe-ai-table-monitor.sqlite3}
      JUHE_AI_USAGE_SHARD_ROOT: ${JUHE_AI_USAGE_SHARD_ROOT:-/app/backend/data/usage-shards}
      JUHE_AI_CODEX_CONTEXT_STATE_SHARD_ROOT: ${JUHE_AI_CODEX_CONTEXT_STATE_SHARD_ROOT:-/app/backend/data/codex-context/state-shards}
    volumes:
      - juhe-ai-data:/app/backend/data:ro
      - juhe-ai-runtime-log-data:/app/backend/runtime-log-data:ro
      - juhe-ai-table-monitor-data:/app/backend/table-monitor-data:ro
      - juhe-ai-audit-log-data:/app/backend/audit-log-data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3303/__aiinternal__/health >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

volumes:
  juhe-ai-data:
  juhe-ai-runtime-log-data:
  juhe-ai-table-monitor-data:
  juhe-ai-audit-log-data:
  juhe-ai-logs:
