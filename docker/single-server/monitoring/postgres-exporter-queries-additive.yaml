# juhe-ai 单机部署 postgres_exporter 增补查询（additive，2026-10-14 起；2026-10-15 修命名）。
#
# 用途：
# - 库/表容量与行数观测，供 Grafana 面板「存储」行消费；
# - 任务停摆、统计游标、账户状态，供告警规则与运维巡检使用。
# 新环境直接用 collector/queries.yaml（全量）；本文件只用于「已有 exporter」的追加。
#
# 合并方式（additive，勿整体替换）：
#   把下方五个顶层键追加进监控机既有 postgres_exporter 的 --extend.query-path 文件
#   顶层映射（与现有查询并列），**不得覆盖或删除现有查询**；
#   若键名冲突，以现网既有内容为准并停下确认，禁止静默覆盖。
#   合并后重载/重启 postgres_exporter 生效。
#
# 命名约定：postgres_exporter 导出指标名 = 查询键名 + "_" + 列别名。
# 面板与文档契约引用 `juhe_postgres_db_size_bytes` / `juhe_postgres_table_size_bytes`
# / `juhe_postgres_table_rows`（见 docs/functions/Prometheus指标暴露设计.md），
# 因此查询键承担前缀、列别名补全后半段——禁止把列别名写成完整指标名，
# 那会导出双前缀名（2026-10-15 生产实测教训）。
#
# 权限：库/表容量只读 pg_database / pg_stat_user_tables；应用健康查询读取
# juhe_stats.background_task_runs、juhe_stats.stats_job_state、juhe_business.accounts。
# 用只读监控角色（collector/sql/monitoring-role.sql），并先创建
# idx_bg_task_runs_job_finished（collector/sql/query-indexes.sql），否则任务停摆查询会全表扫描。

juhe_postgres_db_size:
  # 各库磁盘总大小；排除模板库。库大小含全部 schema（juhe_ai 单库 7 schema 汇总视图）。
  query: |
    SELECT datname,
           pg_database_size(datname) AS bytes
    FROM pg_database
    WHERE datistemplate = false
  metrics:
    - datname:
        usage: "LABEL"
        description: "数据库名"
    - bytes:
        usage: "GAUGE"
        description: "库总大小（字节，pg_database_size）→ juhe_postgres_db_size_bytes"

juhe_postgres_table:
  # 用户表总大小（heap + 索引 + TOAST，pg_total_relation_size）与存活行数估算
  # （n_live_tup 为统计估算值，依赖 autovacuum/ANALYZE 刷新，非精确计数；
  # 用于趋势观察，不用于精确对账）。一次扫描同时出两族。
  # 不含视图/物化视图（pg_stat_user_tables 仅用户表）。
  query: |
    SELECT schemaname,
           relname,
           pg_total_relation_size(relid) AS size_bytes,
           n_live_tup AS rows
    FROM pg_stat_user_tables
  metrics:
    - schemaname:
        usage: "LABEL"
        description: "schema 名"
    - relname:
        usage: "LABEL"
        description: "表名"
    - size_bytes:
        usage: "GAUGE"
        description: "表总大小（字节，含索引与 TOAST）→ juhe_postgres_table_size_bytes"
    - rows:
        usage: "GAUGE"
        description: "表存活行数估算（pg_stat_user_tables.n_live_tup）→ juhe_postgres_table_rows"

# ---- 应用健康查询（已有 exporter 时一并追加；与 collector/queries.yaml 保持一致）----

juhe_app_job_stall:
  # 按任务取最后一条成功完成记录距现在的分钟数。递归跳扫（loose index scan）
  # 取 distinct job_name，每个任务走 (job_name, finished_at) 索引逆序探针，
  # 避免对 background_task_runs 全表 GROUP BY；依赖 sql/query-indexes.sql 的索引。
  query: |
    WITH RECURSIVE jobs AS (
         (SELECT job_name FROM juhe_stats.background_task_runs ORDER BY job_name LIMIT 1)
         UNION ALL
         SELECT (SELECT r.job_name FROM juhe_stats.background_task_runs r
                  WHERE r.job_name > jobs.job_name ORDER BY r.job_name LIMIT 1)
         FROM jobs WHERE jobs.job_name IS NOT NULL
    )
    SELECT jobs.job_name,
           greatest(0, extract(epoch from (now() - r.last_success)) / 60)::int AS minutes_since_success
    FROM jobs
    CROSS JOIN LATERAL (
         SELECT nullif(r2.finished_at, '')::timestamptz AS last_success
         FROM juhe_stats.background_task_runs r2
         WHERE r2.job_name = jobs.job_name AND r2.finished_at <> '' AND r2.status = 'completed'
         ORDER BY r2.finished_at DESC
         LIMIT 1
    ) r
    WHERE jobs.job_name IS NOT NULL
  metrics:
    - job_name:
        usage: LABEL
    - minutes_since_success:
        usage: GAUGE
        description: '距该后台任务上次成功完成的分钟数（停摆检测；24h 级任务在告警规则侧排除）'

juhe_app_stats_cursor_lag:
  # 窗口型 scope 只保留未完结窗口：已完结历史窗口的游标设计上不再推进。
  query: |
    SELECT scope_type || '/' || scope_id || '/' || job_name AS cursor_job,
           greatest(0, extract(epoch from (now() - coalesce(nullif(last_success_at, '')::timestamptz, now() - interval '999 days'))) / 60)::int AS minutes_since_success
    FROM juhe_stats.stats_job_state
    WHERE (scope_type = 'global'
       OR coalesce(split_part(scope_id, ':', 2), '') >= to_char(now(), 'YYYY-MM-DD'))
      AND NOT (job_name = 'authorization_usage_range_windows' AND scope_type = 'global')
  metrics:
    - cursor_job:
        usage: LABEL
    - minutes_since_success:
        usage: GAUGE
        description: '统计游标任务距上次成功推进的分钟数（仅活跃窗口与 global 游标）'

juhe_app_account_status:
  # 账户状态分布：告警只看环比变化，不看绝对值。
  query: |
    SELECT status, count(*)::float AS accounts
    FROM juhe_business.accounts
    WHERE deleted_at IS NULL
    GROUP BY status
  metrics:
    - status:
        usage: LABEL
    - accounts:
        usage: GAUGE
        description: '各状态账户数（环比增量告警用）'
