# 单机 Docker 部署拓扑（国内单服务器，2026-09 起，替代 K3s 混合形态的 go-only 目标形态）。
#
# 与 docker/compose.yml（Harbor/K3s 用）的差异：
# - Postgres/Redis 直接作为 Compose 服务，单库 juhe_ai + 6 schema：4 个由 maintenance
#   --ensure-schema 建（business/dataset/usage/stats；juhe_codex_context 已随
#   2026-11-07 跨协议桥退役，由 revision 20 升级 DROP），juhe_jobs、juhe_j3b
#   需手工 CREATE SCHEMA 后由 maintenance --apply-* 建表（完整序列见同目录 README.md）。
# - gateway 以本机 80 端口经 Caddy 对外，管理 SPA 挂 /__aisys__/，/v1 为 OpenAI 兼容入口。
# - gateway(3306)/jobs(3305) 健康监听经宿主回环端口映射发布，仅 127.0.0.1 可达，
#   供 infra 机 Prometheus 经既有 SSH 隧道抓取（接入说明见 monitoring/README.md）。
# - 镜像来自本地交叉编译二进制（Dockerfile.runtime），服务器上不做源码构建。
# - 密钥与连接串全部在 .env（同目录，不入库）；.env 生成方式见 README.md。
name: juhe-ai

services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: juhe-ai-postgres
    restart: unless-stopped
    # 安全基线（2026-11-06）：禁止进程通过 setuid/setgid 提权。数据库镜像
    # 的入口仍以 root 启动并降权到 postgres，no-new-privileges 不阻断降权。
    security_opt:
      - no-new-privileges:true
    # 单机专用形态的内存调优（2026-09-30 固化进部署契约；此前默认 shared_buffers=128MB
    # 是 8GB 机器上的隐性瓶颈：两库 juhe_ai 3.3GB + juhe_public 222MB 共享 128MB 缓存，
    # 实测缓存命中率 0.85~0.95、iowait ~9%、checkpoint 5 分钟一轮刷 2-3k 缓冲区）。
    # shared_buffers=2GB（物理内存 25% 标准值）；effective_cache_size=4GB 是优化器估值
    # 不占内存。其余参数维持默认，按需再调。
    # shared_preload_libraries=pg_stat_statements（2026-10-08 起，慢 SQL 可追溯契约）：
    # 预加载语句统计扩展，随发布重建后执行 CREATE EXTENSION pg_stat_statements 即可
    # 查询累计慢/热语句（Top-N 采样口径见 .local 运维手册《监控与告警运维.md》）；
    # 逐条慢语句留痕由 ALTER SYSTEM log_min_duration_statement=500ms 负责（reload
    # 级参数，首启后已在实例 postgresql.auto.conf 固化，随数据卷持久）。
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=4GB
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_DB: juhe_ai
      POSTGRES_USER: juhe_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      # PG 18+ 镜像要求挂载 /var/lib/postgresql（数据落在大版本子目录），不支持旧式 .../data 挂载
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juhe_ai -d juhe_ai"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: juhe-ai-redis
    restart: unless-stopped
    # 安全基线（2026-11-06）：与 postgres 同款，只禁止提权，不裁剪入口降权
    # 所需的默认 capability。
    security_opt:
      - no-new-privileges:true
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --maxmemory
      - 1gb
      # state 存储承载熔断/并发等运行态，逐出会破坏正确性，必须 noeviction
      - --maxmemory-policy
      - noeviction
      - --save
      - "900 1"
      - --save
      - "300 10"
      # 慢命令可追溯（2026-10-08 起部署契约）：slowlog 阈值维持默认 10ms（当前生产慢命令
      # 实测集中在 10-15ms 的 Lua 脚本，>10ms 即"服务端耗时异常"的有效信号；收紧到 1ms
      # 会让环形缓冲被常规 eval 刷满，反而丧失巡检价值），ring 从默认 128 扩到 1024 增加
      # 追溯窗口。持久留痕由宿主机 /opt/juhe-monitoring/redis-slowlog 快照 cron 负责
      # （每 5 分钟按 id 增量导出到 jsonl 并出 node-exporter textfile 指标，见监控手册）。
      - --slowlog-max-len
      - "1024"
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        BASE_IMAGE: docker.m.daocloud.io/library/alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
        TARGET_BINARY: juhe-ai-gateway
    image: juhe-ai-single-server:${JUHE_AI_IMAGE_TAG:-latest}-gateway
    container_name: juhe-ai-go-gateway
    # BUG-0313 内存治理：GOMEMLIMIT 软限（见 environment）让 GC 封顶堆增长（流量高峰 RSS 曾冲
    # 3.56GiB 挤爆整机页缓存引发僵死），mem_limit 为最后防线——超限只杀 gateway 自身，不拖整机。
    # 2026-10-27 整机转 juhe-ai 专供（juhe-pw 应用族下线）后重划：3g→4g，配合
    # GOMEMLIMIT 2300MiB→3072MiB（维持 75% 比例）；整机最坏预算 gateway ~3.2GiB
    # + PG ~3GiB + jobs/监控/caddy ~0.5GiB ≈ 6.7GiB，8G 物理仍留页缓存与 swap 兜底。
    mem_limit: "4g"
    restart: unless-stopped
    # 安全基线（2026-11-06）：gateway 以非 root app 用户运行，根文件系统只读；
    # 可写面仅 /app/backend/data、/app/backend/logs（下方挂载）与 /tmp（tmpfs）。
    # 非 root 且监听端口均 >1024，不需要任何 Linux capability。
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
    # 优雅关闭串行预算最坏 20s（main 10s + j3b 5s + health 5s）；默认 10s 宽限
    # 会在在途 SSE 上 SIGKILL，usage/审计尚未构造即丢。必须大于关闭预算。
    stop_grace_period: 30s
    # datadir/日志等相对路径约定以进程 cwd 为基准（缺省 ./data 相对 cwd）；
    # 镜像未设 WORKDIR，必须显式锚定到 /app/backend，相对 data/logs 才落在
    # 下方挂载的宿主机持久目录（usage spool 交接、文件日志等）。
    working_dir: /app/backend
    # 固定容器 IP：Caddy 直连 IP，不经 Docker DNS（偶发 lookup 失败会导致 502）；
    # 172.18.x 为 compose 内网段（下方 ipam），非公网实例事实，无需变量化
    networks:
      default:
        ipv4_address: 172.18.0.10
    ports:
      # 健康监听宿主回环发布：仅 127.0.0.1 可达（部署层必须拒绝公网入口、只允许
      # 受限 Prometheus 抓取），供 infra 机经 SSH 隧道抓取 /__aisys__/metrics。
      - "127.0.0.1:3306:3306"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      # Go 堆软限制（BUG-0313；2026-10-27 专供重划 2300MiB→3072MiB）：接近 3072MiB 时
      # GC 激进回收，RSS 实际封顶约 3.2GiB，把页缓存还给系统。
      GOMEMLIMIT: 3072MiB
      JUHE_AI_HOST: 0.0.0.0
      # 不显式指向 dist 就不挂管理 SPA（代码默认空）
      JUHE_AI_FRONTEND_DIST_PATH: /app/frontend/dist
      # 运行日志文件写侧/grep 面（gateway）与索引器/轮转清理（jobs）必须三方同目录。
      # 未配置时 gateway 会经 datadir 派生 <DATA_DIR>/logs 默认开启（与 jobs 派生对称），
      # 但派生目录可能与 jobs 显式目录不同源、破坏三方同目录契约，故此处显式配置
      # （显式 disabled 字面量才关闭，完整契约见 README.md ".env 契约"节）
      JUHE_AI_LOG_DIR: /app/backend/logs
      # gateway 健康监听绑全接口（代码默认 127.0.0.1:3306）：compose healthcheck
      # 仍走容器内 127.0.0.1，绑 0.0.0.0 只为让 ports 的宿主回环映射可达，供
      # infra 机 Prometheus 经既有 SSH 隧道抓取 GET /__aisys__/metrics
      # （抓取配置、面板导入与告警迁移见 monitoring/README.md）。
      JUHE_AI_GATEWAY_HEALTH_LISTEN_ADDRESS: 0.0.0.0:3306
      # 健康监听默认 fail-closed 只允许回环地址；容器内需要绑 0.0.0.0 才能被
      # ports 的宿主回环映射（127.0.0.1:3306:3306）转发。该开关只放行私网与
      # 未指定地址，公网地址任何情况拒绝（见 gateway main.go validateHealthListenHost）。
      JUHE_AI_GATEWAY_HEALTH_ALLOW_NON_LOOPBACK: "true"
      # F3/F4 owner 租约启动获取等待（BUG-0228，2026-09-28 起）：compose recreate
      # 先 stop 旧容器（SIGTERM 10s 宽限后 SIGKILL），旧 gateway 优雅关闭预算
      # （10s+5s+5s 串行 HTTP shutdown + defer 链）超 10s 被强杀时 defer 租约
      # 释放未执行，新进程须等 DB 租约 TTL（默认 30s）过期才能 acquire 成功；
      # 默认空保持 fail-fast 契约（活 owner 并存快速失败），45s 为生产实例值
      # （> 30s TTL，覆盖发布过渡窗口，F3/F4 两获取点共用）。jobs 无启动
      # fail-fast 租约（运行期由 supervisor 重试覆盖），不配。
      JUHE_AI_OWNER_LEASE_ACQUIRE_WAIT: 45s
    extra_hosts:
      # host.docker.internal 非实例事实；data/egress 两条隧道域名的出海代理公网 IP 属实例事实
      # （BUG-0225，不入库），由 .env 的 JUHE_AI_PROXY_IP_A/B 注入，缺失时 compose config 阶段
      # 即报错（与 POSTGRES_PASSWORD 的 :?required 同模式）。
      - "host.docker.internal:host-gateway"
      - "data.aijh.huanmin.top:${JUHE_AI_PROXY_IP_A:?JUHE_AI_PROXY_IP_A is required}"
      - "data.aijh.huanmin.top:${JUHE_AI_PROXY_IP_B:?JUHE_AI_PROXY_IP_B is required}"
      - "egress.aijh.huanmin.top:${JUHE_AI_PROXY_IP_A:?JUHE_AI_PROXY_IP_A is required}"
      - "egress.aijh.huanmin.top:${JUHE_AI_PROXY_IP_B:?JUHE_AI_PROXY_IP_B is required}"
    env_file: .env
    volumes:
      # PG 模式下该目录仍承载 usage spool 等文件数据（codex-context 目录已随
      # 2026-11-07 桥退役停止读写，历史目录按部署文档人工备份后清理）
      - ./data/app/data:/app/backend/data
      - ./data/app/logs:/app/backend/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3306/health"]
      # start_period 75s（BUG-0228）：F3/F4 租约等待发生在 health server 监听
      # 之前，最坏 45s 等待 + 启动余量；探测本身（10s 间隔 ×12 次）不放宽
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 75s

  jobs:
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        BASE_IMAGE: docker.m.daocloud.io/library/alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
        TARGET_BINARY: juhe-ai-jobs
    image: juhe-ai-single-server:${JUHE_AI_IMAGE_TAG:-latest}-jobs
    container_name: juhe-ai-go-jobs
    # BUG-0313 内存治理：jobs 当前 RSS ~114MiB，硬限防异常扩散。
    mem_limit: "1g"
    restart: unless-stopped
    # 安全基线（2026-11-06）：jobs 以非 root app 用户运行，根文件系统只读；
    # 可写面仅与 gateway 同源的 data/logs 挂载与 /tmp。监听 3305 >1024，
    # 不需要任何 capability。
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
    # 与 gateway 同批停写；给任务 finish/租约释放留出排空时间。
    stop_grace_period: 30s
    # 与 gateway 同理：spool drain 目录按相对路径派生，必须锚定 /app/backend
    # 才能与网关共享宿主机挂载的 data 目录（两侧同源才能完成用量交接）。
    working_dir: /app/backend
    ports:
      # 健康监听宿主回环发布：仅 127.0.0.1 可达（部署层必须拒绝公网入口、只允许
      # 受限 Prometheus 抓取），供 infra 机经 SSH 隧道抓取指标。
      - "127.0.0.1:3305:3305"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      JUHE_AI_INSTANCE_ID: juhe-ai-jobs
      # 与 gateway 同目录：F1 索引器按文件 cursor 消费 juhe-ai.log 与轮转文件，
      # 保留清理也只删该目录下的 rotated 文件
      JUHE_AI_LOG_DIR: /app/backend/logs
      # jobs 健康监听绑全接口（BUG-0226：代码默认仍是 127.0.0.1；容器网络无公网
      # 映射，不构成暴露）。原「gateway 跨容器抓取 jobs 健康段」接线已随系统指标
      # 统计功能下线删除；该端口现经上方 ports 宿主回环映射，供 infra 机
      # Prometheus 经 SSH 隧道抓取。
      JUHE_AI_JOBS_HEALTH_LISTEN_ADDRESS: 0.0.0.0:3305
    extra_hosts:
      # host.docker.internal 非实例事实；data/egress 两条隧道域名的出海代理公网 IP 属实例事实
      # （BUG-0225，不入库），由 .env 的 JUHE_AI_PROXY_IP_A/B 注入，缺失时 compose config 阶段
      # 即报错（与 POSTGRES_PASSWORD 的 :?required 同模式）。
      - "host.docker.internal:host-gateway"
      - "data.aijh.huanmin.top:${JUHE_AI_PROXY_IP_A:?JUHE_AI_PROXY_IP_A is required}"
      - "data.aijh.huanmin.top:${JUHE_AI_PROXY_IP_B:?JUHE_AI_PROXY_IP_B is required}"
      - "egress.aijh.huanmin.top:${JUHE_AI_PROXY_IP_A:?JUHE_AI_PROXY_IP_A is required}"
      - "egress.aijh.huanmin.top:${JUHE_AI_PROXY_IP_B:?JUHE_AI_PROXY_IP_B is required}"
    env_file: .env
    volumes:
      - ./data/app/data:/app/backend/data
      - ./data/app/logs:/app/backend/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3305/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # 一次性工具：docker compose run --rm maintenance --ensure-schema --seed
  # （--dsn/--secret 已由 env_file 提供，也可显式传参覆盖）
  maintenance:
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        BASE_IMAGE: docker.m.daocloud.io/library/alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
        TARGET_BINARY: juhe-ai-maintenance
    image: juhe-ai-single-server:${JUHE_AI_IMAGE_TAG:-latest}-maintenance
    container_name: juhe-ai-maintenance
    profiles: ["tool"]
    # 安全基线（2026-11-06）：一次性维护容器同样以非 root app 用户运行，
    # 根文件系统只读；维护产物写上方 data 挂载，/tmp 由 tmpfs 提供。
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
    # 与 gateway/jobs 同理：datadir 相对路径按 cwd 解析，一次性容器同样锚定
    # /app/backend，保证维护产物（若有）落在与常驻进程一致的挂载目录。
    working_dir: /app/backend
    volumes:
      # 与 jobs 同款挂载：一次性容器（run --rm）没有挂载时，--manifest-out 等
      # 维护产物写进容器可写层、随容器销毁丢失（2026-11-03 实证）。挂载后
      # manifest 落宿主机 data/app/data，可事后复核。
      - ./data/app/data:/app/backend/data
      - ./data/app/logs:/app/backend/logs
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 与 gateway/jobs 同值：maintenance 的 secret 消费命令（capability-domain
      # migrate/verify、--seed）在 production 缺 --secret/JUHE_AI_SECRET 时 exit 2，
      # 不回落到仓库内公开的开发默认密钥。
      NODE_ENV: production
      TZ: Asia/Shanghai
    extra_hosts:
      # host.docker.internal 非实例事实；data/egress 两条隧道域名的出海代理公网 IP 属实例事实
      # （BUG-0225，不入库），由 .env 的 JUHE_AI_PROXY_IP_A/B 注入，缺失时 compose config 阶段
      # 即报错（与 POSTGRES_PASSWORD 的 :?required 同模式）。
      - "host.docker.internal:host-gateway"
      - "data.aijh.huanmin.top:${JUHE_AI_PROXY_IP_A:?JUHE_AI_PROXY_IP_A is required}"
      - "data.aijh.huanmin.top:${JUHE_AI_PROXY_IP_B:?JUHE_AI_PROXY_IP_B is required}"
      - "egress.aijh.huanmin.top:${JUHE_AI_PROXY_IP_A:?JUHE_AI_PROXY_IP_A is required}"
      - "egress.aijh.huanmin.top:${JUHE_AI_PROXY_IP_B:?JUHE_AI_PROXY_IP_B is required}"
    env_file: .env

  caddy:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    container_name: juhe-ai-caddy
    restart: unless-stopped
    # healthcheck 的 busybox wget 走 https 每次泄漏 1 个 ssl_client 子进程（busybox 固有行为），
    # caddy 自身作为 PID 1 不回收（2026-09-29 生产曾堆积 9470 个 zombie 致 docker exec 全败）；
    # init: true 注入 docker 内置 init（tini）负责收割。
    init: true
    # 安全基线（2026-11-06）：根文件系统只读，可写面仅 /data、/config 卷与
    # /tmp；capability 只保留 NET_BIND_SERVICE 以绑定 80/443（TCP+UDP），
    # 其余 capability 全部裁剪。
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 (QUIC over UDP)：握手更快且绕开 TCP 层 DPI，浏览器自动协商
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # 经域名 hairpin 走完整链路（TLS 终止 + 路由 + 上游）；
      # 127.0.0.1 无站点证书（TLS 必报 internal error），8080 是宿主机侧映射（容器内不存在）
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://aijh.huanmin.top/__aisys__/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1

volumes:
  caddy_data:
  caddy_config:
