# 集群模式 · gateway 节点（每台 gateway 机器执行一份；与单机/其它角色隔离）。
#
#   cp .env.example .env && vi .env          # 至少填 GATEWAY_IMAGE/SHARED_ROOT/INSTANCE_ID
#   docker compose -f compose.gateway.yml up -d
#
# 与 docker/single-server/compose.yml 的差异：
#   - 不启动 PostgreSQL/Redis（外部云 RDS/云 Redis，连接串在 .env）；
#   - 镜像来自镜像仓库的 digest 引用（滚动发布锚点），本机不构建；
#   - 前端不在本镜像内（独立 frontend 服务见 compose.edge.yml）；
#   - 无固定容器 IP、无单机隧道域名 extra_hosts。
name: juhe-ai-gateway

services:
  gateway:
    image: ${JUHE_AI_GATEWAY_IMAGE:?JUHE_AI_GATEWAY_IMAGE is required}
    container_name: juhe-ai-gateway
    restart: unless-stopped
    mem_limit: "4g"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
    stop_grace_period: 30s
    working_dir: /app/backend
    ports:
      # gateway API 只对内网/LB 暴露，公网入口必须经入口机 Caddy/云 LB。
      - "${JUHE_AI_GATEWAY_BIND:-0.0.0.0}:3000:3000"
      # 健康/指标仅回环，Prometheus 经 SSH 隧道抓取。
      - "127.0.0.1:3306:3306"
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      # Go 堆软限制：RSS 约封顶 GOMEMLIMIT + 200MiB，与 mem_limit 4g 同比例。
      GOMEMLIMIT: 3072MiB
      JUHE_AI_HOST: 0.0.0.0
      JUHE_AI_PORT: "3000"
      # 全集群唯一：日志文件名、build_info instance_id、后台任务 owner 依赖它。
      JUHE_AI_INSTANCE_ID: ${JUHE_AI_INSTANCE_ID:?JUHE_AI_INSTANCE_ID is required}
      JUHE_AI_LOG_INSTANCE_ID: ${JUHE_AI_INSTANCE_ID}
      # 运行日志文件写侧（gateway）与索引器/清理（jobs）必须同目录；
      # 文件名为 juhe-ai.<INSTANCE_ID>.log，多节点共享日志目录互不覆盖。
      JUHE_AI_LOG_DIR: /app/backend/logs
      JUHE_AI_GATEWAY_HEALTH_LISTEN_ADDRESS: 0.0.0.0:3306
      JUHE_AI_GATEWAY_HEALTH_ALLOW_NON_LOOPBACK: "true"
      # 每台网关前面的可信代理层数：1 = 只有一层入口 Caddy/云 LB。
      JUHE_AI_TRUST_PROXY: ${JUHE_AI_TRUST_PROXY:-1}
      # SIGKILL 后旧实例 DB 租约 30s TTL 过期前的等待，覆盖滚动发布过渡窗口。
      JUHE_AI_OWNER_LEASE_ACQUIRE_WAIT: 45s
    env_file: .env
    volumes:
      # 默认节点本地目录（不强制 NFS/NAS）；跨节点共享按需配置
      # JUHE_AI_SHARED_ROOT，决策与原因见 README「共享目录决策表」。
      # 共享时节点 UID/GID 必须一致（app=1000）。
      - ${JUHE_AI_SHARED_ROOT:-./data/app}/data:/app/backend/data
      - ${JUHE_AI_SHARED_ROOT:-./data/app}/logs:/app/backend/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3306/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 75s
