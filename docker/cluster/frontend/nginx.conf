# 管理面 SPA 静态站（2026-11-07 从 gateway 镜像拆出，集群模式专用）。
# 前端 vite base 为 /__aisys__/，因此 compose 把 dist 挂到 html/__aisys__/；
# 本服务只做静态资源与 SPA fallback，/v1、/__aisys__/api 等网关路由面由
# Caddy 直接反代 gateway，不经过本服务，避免多一跳与转发语义分叉。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 入口不缓存，发布后刷新即取新版本；assets 带内容 hash，长缓存。
    location = /__aisys__/index.html { add_header Cache-Control "no-store"; }
    location = /__aisys__/brand-icon.svg { add_header Cache-Control "no-store"; }
    location = /__aisys__/build-info.json { add_header Cache-Control "no-store"; }
    location /__aisys__/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA 客户端路由与帮助中心静态目录（dist/help）回落到 index.html。
    location /__aisys__/ { try_files $uri $uri/ /__aisys__/index.html; }

    # 其余路径不属于前端（网关路由面在 Caddy 已分流），显式 404。
    location / { return 404; }
}
