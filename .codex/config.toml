[mcp_servers.codegraph]
command = "codegraph"
args = [
    "serve",
    "--mcp",
]

[mcp_servers.codegraph.env]
CODEGRAPH_TELEMETRY = "0"
CODEGRAPH_NO_UPDATE_CHECK = "1"
DO_NOT_TRACK = "1"

[mcp_servers.aoci]
command = "C:/Users/Administrator/AppData/Local/agent-toolchain/bin/aoci.exe"
args = [
    "--repo",
    "F:/sub2api-lite",
    "mcp",
]
